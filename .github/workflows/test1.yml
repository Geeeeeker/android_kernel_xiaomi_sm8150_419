name: 编译内核与设备树 (含 USB/IP)

on:
  push:
    branches:
      - dev/*
      - stable/*
  workflow_dispatch:

env:
  AOSP_TOOLCHAIN_BRANCH: android16
  AOSP_CLANG_VERSION: r547379
  BOOT_IMG_URL: https://github.com/Geeeeeker/kernel_xiaomi_raphael-pixel/releases/download/2.0/raphael_boot.img

jobs:
  build:
    name: 编译内核与设备树
    permissions: { contents: write }
    runs-on: ubuntu-latest
    strategy:
      matrix:
        device: [raphael]
    steps:
      - name: 安装基础软件包
        run: |
          sudo apt update > /dev/null
          sudo apt install -y \
            ccache binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi \
            device-tree-compiler dos2unix gcc-aarch64-linux-gnu \
            autoconf libtool pkg-config flex bison patchelf \
            kmod bc libelf-dev

      - name: 设置 QEMU 用户态支持
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user-static binfmt-support
          docker run --rm --privileged multiarch/qemu-user-static --reset -p yes

      - name: 同步仓库
        uses: actions/checkout@v4
        with:
          path: kernel

      - name: 深度清理设备树源文件
        working-directory: kernel
        run: |
          find arch/arm64/boot/dts -type f \( -name "*.dts" -o -name "*.dtsi" \) -print0 | while IFS= read -r -d '' FILE; do
            echo "正在清理: $FILE"
            sed -i '1s/^\xEF\xBB\xBF//' "$FILE"
            dos2unix "$FILE"
            tr -cd '\11\12\15\40-\176' < "$FILE" > "${FILE}.clean"
            mv "${FILE}.clean" "$FILE"
            echo >> "$FILE"
          done

      - name: 缓存 Clang
        id: cache-clang
        uses: actions/cache@v4
        with:
          path: clang
          key: clang-${{ env.AOSP_TOOLCHAIN_BRANCH }}-${{ env.AOSP_CLANG_VERSION }}

      - name: 下载 Clang
        if: steps.cache-clang.outputs.cache-hit != 'true'
        run: |
          mkdir -p clang &&
          curl -LSs "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/${{ env.AOSP_TOOLCHAIN_BRANCH }}-release/clang-${{ env.AOSP_CLANG_VERSION }}.tar.gz" |
          tar xz -C clang

      - name: 缓存 ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: kernel-${{ matrix.device }}
          restore-keys: kernel-${{ matrix.device }}
          max-size: 5G

      - name: 配置内核基础参数
        working-directory: kernel
        run: |
          DEFCONFIG="arch/arm64/configs/raphael_defconfig"
          # 原有配置
          echo "CONFIG_MODULES=y" >> $DEFCONFIG
          echo "CONFIG_KPROBES=y" >> $DEFCONFIG
          echo "CONFIG_HAVE_KPROBES=y" >> $DEFCONFIG
          echo "CONFIG_KPROBE_EVENTS=y" >> $DEFCONFIG
          echo "CONFIG_OVERLAY_FS=y" >> $DEFCONFIG
          sed -i 's/CONFIG_LTO=y/CONFIG_LTO=n/' $DEFCONFIG
          sed -i 's/CONFIG_LTO_CLANG=y/CONFIG_LTO_CLANG=n/' $DEFCONFIG
          sed -i 's/CONFIG_THINLTO=y/CONFIG_THINLTO=n/' $DEFCONFIG
          echo "CONFIG_LTO_NONE=y" >> $DEFCONFIG
          echo "CONFIG_CC_WERROR=n" >> $DEFCONFIG
          echo "CONFIG_BPF_JIT=y" >> $DEFCONFIG
          echo "# CONFIG_BPF_JIT_ALWAYS_ON is not set" >> $DEFCONFIG
          echo "CONFIG_BPF_SYSCALL=y" >> $DEFCONFIG

          # 新增配置
          echo "CONFIG_SYSVIPC=y" >> $DEFCONFIG
          echo "CONFIG_SYSVIPC_SYSCTL=y" >> $DEFCONFIG
          echo "CONFIG_SYSVIPC_COMPAT=y" >> $DEFCONFIG
          echo "CONFIG_EPOLL=y" >> $DEFCONFIG
          echo "CONFIG_EVENTFD=y" >> $DEFCONFIG
          echo "CONFIG_SIGNALFD=y" >> $DEFCONFIG
          echo "CONFIG_INOTIFY_USER=y" >> $DEFCONFIG
          echo "CONFIG_SHMEM=y" >> $DEFCONFIG
          echo "CONFIG_TMPFS=y" >> $DEFCONFIG
          echo "CONFIG_TMPFS_POSIX_ACL=y" >> $DEFCONFIG
          echo "CONFIG_TMPFS_XATTR=y" >> $DEFCONFIG
          # USB/IP 配置
          echo "CONFIG_USBIP_CORE=m" >> $DEFCONFIG
          echo "CONFIG_USBIP_VHCI_HCD=m" >> $DEFCONFIG
          echo "CONFIG_USBIP_HOST=m" >> $DEFCONFIG
          # 模块版本控制
          sed -i '/CONFIG_MODVERSIONS/d' $DEFCONFIG
          echo "CONFIG_MODVERSIONS=y" >> $DEFCONFIG
          echo "CONFIG_SECTION_MISMATCH_WARN_ONLY=y" >> $DEFCONFIG

      - name: 配置 LXC 和 Docker 支持
        working-directory: kernel
        run: |
          DEFCONFIG="arch/arm64/configs/raphael_defconfig"
          rm -rf utils
          git clone https://github.com/tomxi1997/lxc-docker-support-for-android.git utils
          sed -i '/select CFS_BANDWIDTH/d' utils/Kconfig
          sed -i '/select DOCKER_STATISTICS/d' utils/Kconfig
          sed -i '/select BLK_DEV_THROTTLING/d' utils/Kconfig
          sed -i '/select CFQ_GROUP_IOSCHED/d' utils/Kconfig
          sed -i '/select BRIDGE_VLAN_FILTERING/d' utils/Kconfig
          echo 'source "utils/Kconfig"' >> "Kconfig"
          echo "CONFIG_DOCKER=y" >> $DEFCONFIG
          echo "# CONFIG_CFS_BANDWIDTH is not set" >> $DEFCONFIG
          echo "# CONFIG_DOCKER_STATISTICS is not set" >> $DEFCONFIG
          sed -i '/CONFIG_ANDROID_PARANOID_NETWORK/d' $DEFCONFIG
          echo "# CONFIG_ANDROID_PARANOID_NETWORK is not set" >> $DEFCONFIG
          echo "# CONFIG_BLK_DEV_THROTTLING is not set" >> $DEFCONFIG
          echo "# CONFIG_CFQ_GROUP_IOSCHED is not set" >> $DEFCONFIG
          # 修复 QVR 设备树
          sed -i '/sdm845-v2-qvr-evt.dtb/d' arch/arm64/boot/dts/qcom/Makefile
          sed -i '/qvr/d' arch/arm64/boot/dts/qcom/Makefile
          sed -i '/interposer/d' arch/arm64/boot/dts/qcom/Makefile
          # runc 补丁
          chmod +x utils/runcpatch.sh
          if [ -f kernel/cgroup/cgroup.c ]; then
              sh utils/runcpatch.sh kernel/cgroup/cgroup.c
          fi
          if [ -f kernel/cgroup.c ]; then
              sh utils/runcpatch.sh kernel/cgroup.c
          fi
          if [ -f net/netfilter/xt_qtaguid.c ]; then
              patch -p0 < utils/xt_qtaguid.patch
          fi

      - name: 编译内核与设备树
        working-directory: kernel
        run: |
          export PATH=$GITHUB_WORKSPACE/clang/bin:$PATH
          export KBUILD_BUILD_USER=${{ github.repository_owner }}
          export KBUILD_BUILD_HOST=github-runner
          export KBUILD_BUILD_TIMESTAMP=$(date -u -d "@$(git log -1 --format=%at)" +"%a %b %d %H:%M:%S %Z %Y")
          make -j$(nproc --all) \
            CC="ccache clang" \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            O=out \
            KCFLAGS="-Wno-error=strict-prototypes" \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            raphael_defconfig Image.gz dtbs

      - name: 编译 USB/IP 内核模块 (主机)
        working-directory: kernel
        run: |
          export PATH=$GITHUB_WORKSPACE/clang/bin:$PATH
          make -j$(nproc --all) \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            O=out \
            CROSS_COMPILE=aarch64-linux-gnu- \
            M=drivers/usb/usbip \
            modules
          # 将生成的 .ko 文件复制到输出目录
          mkdir -p $GITHUB_WORKSPACE/usbip-out/modules
          cp out/drivers/usb/usbip/*.ko $GITHUB_WORKSPACE/usbip-out/modules/

      - name: 编译 USB/IP 用户态工具 (Docker 容器)
        run: |
          mkdir -p usbip-out/{bin,libs}
          docker run --rm --platform linux/arm64 \
            -v ${{ github.workspace }}/kernel:/kernel-src \
            -v ${{ github.workspace }}/usbip-out:/output \
            -w /kernel-src \
            arm64v8/ubuntu:22.04 \
            bash -c "
              set -e
              export DEBIAN_FRONTEND=noninteractive

              # 安装用户态工具编译依赖
              apt update
              apt install -y \
                build-essential \
                autoconf \
                libtool \
                pkg-config \
                libudev-dev \
                libssl-dev \
                flex \
                bison \
                file \
                patchelf

              # 编译 USB/IP 用户态工具
              cd tools/usb/usbip
              ./autogen.sh
              ./configure --prefix=/usr
              make -j\$(nproc)

              # 复制二进制和库
              cp src/.libs/usbip /output/bin/
              cp src/.libs/usbipd /output/bin/
              cp libsrc/.libs/libusbip.so.0* /output/libs/

              # 收集动态库依赖
              cd /output
              BINARIES=\"bin/usbip bin/usbipd libs/libusbip.so.0*\"
              DEPS=\"\"

              for file in \$BINARIES; do
                if [ -f \"\$file\" ]; then
                  echo \"Collecting dependencies for \$file...\"
                  needed=\$(readelf -d \"\$file\" | grep NEEDED | awk '{print \$5}' | tr -d '[]' || true)
                  for lib in \$needed; do
                    if [[ \"\$DEPS\" != *\"\$lib\"* ]]; then
                      DEPS=\"\$DEPS \$lib\"
                    fi
                  done
                fi
              done

              # 复制库文件
              for lib in \$(echo \$DEPS | tr ' ' '\\n' | sort -u); do
                echo \"Searching for library: \$lib\"
                libpath=\$(find /lib /usr/lib -name \"\$lib\" -type f 2>/dev/null | head -1 || true)
                if [ -n \"\$libpath\" ]; then
                  echo \"Found: \$libpath\"
                  cp -P \"\$libpath\" libs/ 2>/dev/null || cp \"\$libpath\" libs/
                  for reallib in \$(find \"\$(dirname \"\$libpath\")\" -name \"\${lib%.so*}*\" -type f 2>/dev/null); do
                    cp -n \"\$reallib\" libs/ 2>/dev/null || true
                  done
                else
                  echo \"Warning: library \$lib not found\"
                fi
              done

              # 复制动态链接器
              ld_linux=\"/lib/ld-linux-aarch64.so.1\"
              if [ -f \"\$ld_linux\" ]; then
                cp -P \"\$ld_linux\" libs/
              fi

              echo \"USB/IP user-space tools build and collection complete.\"
            "

      - name: 打包 USB/IP 产物
        run: |
          cd usbip-out
          tar czf ../usbip-arm64-bundle.tar.gz .
          cd ..

      - name: 安装 abootimg
        run: sudo apt install -y abootimg

      - name: 使用 abootimg 重新打包 boot.img
        id: repack_boot
        run: |
          # 下载参考 boot.img
          curl -fLSs "${{ env.BOOT_IMG_URL }}" -o boot.img
          mkdir boot_repack
          cd boot_repack
          # 解包
          abootimg -x ../boot.img
          # 替换内核
          cp $GITHUB_WORKSPACE/kernel/out/arch/arm64/boot/Image.gz kernel
          # 重新打包
          abootimg --create $GITHUB_WORKSPACE/boot-raphael.img -f bootimg.cfg -k kernel -r initrd.img
          cd ..

      - name: 生成 AnyKernel3 压缩包
        run: |
          git clone https://github.com/osm0sis/AnyKernel3 --depth=1 ak3
          cp kernel/out/arch/arm64/boot/Image.gz ak3/
          mkdir -p ak3/dtb ak3/dtbo
          DTB_FILE=$(find kernel/out/arch/arm64/boot/dts -name "sm8150-xiaomi.dtb" | head -n1)
          cp "$DTB_FILE" ak3/dtb/dtb
          DTBO_FILE=$(find kernel/out/arch/arm64/boot/dts -name "raphael*.dtbo" | head -n1)
          cp "$DTBO_FILE" ak3/dtbo/dtbo

          cd ak3
          KERNEL_VERSION=$(make -C ../kernel kernelversion)
          ZIP_NAME="Anykernel3-${{ matrix.device }}-${KERNEL_VERSION}.zip"

          cat > anykernel.sh << EOF
          properties() {
            kernel.string=Kernel for ${{ matrix.device }}
            device.name1=${{ matrix.device }}
            do.devicecheck=1
          }
          kernel=Image.gz
          ramdisk_compression=auto
          patch_vbmeta_flag=auto
          is_slot_device=auto
          block=auto
          . tools/ak3-core.sh
          split_boot
          flash_boot
          EOF

          zip -qr9 "$ZIP_NAME" * -x .git .github README.md *placeholder
          mv "$ZIP_NAME" $GITHUB_WORKSPACE/
          cd ..

      - name: 上传 AnyKernel3 ZIP
        uses: actions/upload-artifact@v5
        with:
          name: kernel-${{ matrix.device }}-ak3
          path: Anykernel3-${{ matrix.device }}-*.zip

      - name: 上传 boot.img
        uses: actions/upload-artifact@v5
        with:
          name: kernel-${{ matrix.device }}-bootimg
          path: boot-raphael.img

      - name: 上传 USB/IP 捆绑包
        uses: actions/upload-artifact@v5
        with:
          name: kernel-${{ matrix.device }}-usbip
          path: usbip-arm64-bundle.tar.gz

  release:
    name: 发布
    permissions: { contents: write }
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: 获取构建产物
        uses: actions/download-artifact@v6
        with:
          path: artifacts
          pattern: kernel-*
          merge-multiple: true

      - name: 获取当前时间
        id: time
        run: |
          echo "time=$(TZ='Asia/Shanghai' date -u +'%Y%m%d%H%M')" >> $GITHUB_OUTPUT
          echo "timestamp=$(date +%s)" >> $GITHUB_OUTPUT

      - name: 下载 KernelSU Manager (可选)
        continue-on-error: true
        uses: dawidd6/action-download-artifact@v11
        with:
          repo: rsuntk/KernelSU
          workflow_conclusion: success
          name: manager
          workflow: build-manager.yml
          path: manager

      - name: 发布
        uses: softprops/action-gh-release@v2
        with:
          tag_name: rel-${{ steps.time.outputs.timestamp }}
          name: Kernel build ${{ steps.time.outputs.time }}
          prerelease: ${{ startsWith(github.ref_name, 'dev/') }}
          files: |
            artifacts/*
            manager/*
