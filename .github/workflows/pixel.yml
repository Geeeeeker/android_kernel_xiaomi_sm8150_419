name: Continuous Testing

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KBUILD_BUILD_USER: NATO66613
      KBUILD_BUILD_HOST: KREMLIN
    steps:
      - name: Clone kernel source
        run: git clone --depth 1 -b 16.0 https://github.com/Geeeeeker/kernel_xiaomi_raphael-pixel kernel

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          create-symlink: true
          key: kernel-build-cache
          restore-keys: |
            kernel-build-cache
          max-size: '10G'

      - name: Restore toolchain cache
        id: restore-clang
        uses: actions/cache/restore@v4
        with:
          path: /home/runner/r547379
          key: clang-r547379

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex libelf-dev libncurses-dev libssl-dev unzip zip wget libarchive-tools abootimg
          ccache --show-stats

      - name: Deploy Clang
        if: steps.restore-clang.outputs.cache-hit != 'true'
        run: |
          git clone https://gitlab.com/crdroidandroid/android_prebuilts_clang_host_linux-x86_clang-r547379.git /home/runner/r547379 --depth=1

      - name: Save clang
        if: steps.restore-clang.outputs.cache-hit != 'true'
        id: cache-clang-save
        uses: actions/cache/save@v4
        with:
          path: /home/runner/r547379
          key: clang-r547379

      - name: Configure and build kernel
        working-directory: kernel
        run: |
          export CLANG_PATH=$HOME/r547379/bin
          export PATH=${CLANG_PATH}:${PATH}
          
          make LLVM=1 LLVM_IAS=1 ARCH=arm64 CC="ccache clang" O=out raphael_defconfig
          
          cd out
          for cfg in CONFIG_SYSVIPC CONFIG_SYSVIPC_SYSCTL CONFIG_SYSVIPC_COMPAT CONFIG_EPOLL CONFIG_EVENTFD CONFIG_SIGNALFD CONFIG_INOTIFY_USER CONFIG_SHMEM CONFIG_TMPFS CONFIG_TMPFS_POSIX_ACL CONFIG_TMPFS_XATTR CONFIG_SECTION_MISMATCH_WARN_ONLY; do
            ../scripts/config --enable ${cfg#CONFIG_}
          done
          for cfg in CONFIG_USBIP_CORE CONFIG_USBIP_VHCI_HCD CONFIG_USBIP_HOST; do
            ../scripts/config --module ${cfg#CONFIG_}
          done
          ../scripts/config --enable MODULES
          ../scripts/config --disable MODVERSIONS
          make LLVM=1 LLVM_IAS=1 ARCH=arm64 CC="ccache clang" olddefconfig
          cd ..
          
          make LLVM=1 LLVM_IAS=1 ARCH=arm64 CC="ccache clang" O=out -j$(nproc)
          
          ccache --show-stats
          ccache --show-config

      - name: Verify kernel config
        run: |
          echo "=== 内核配置检查 ==="
          grep -E "CONFIG_SYSVIPC|CONFIG_USBIP_CORE" kernel/out/.config || true
          echo "=== USBIP 模块检查 ==="
          ls -l kernel/out/drivers/usb/usbip/*.ko || echo "未找到 USBIP 模块（可能未编译）"

      - name: Download reference boot.img
        run: |
          wget https://github.com/Geeeeeker/kernel_xiaomi_raphael-pixel/releases/download/2.0/raphael_boot.img -O raphael_boot.img

      - name: Create new boot.img
        run: |
          abootimg -x raphael_boot.img
          mv initrd.img ramdisk.img
          # 确认新内核存在且非空
          ls -lh kernel/out/arch/arm64/boot/Image.gz-dtb
          abootimg --create boot.img -f bootimg.cfg -k kernel/out/arch/arm64/boot/Image.gz-dtb -r ramdisk.img
          # 验证新 boot.img 包含内核（可选）
          abootimg -i boot.img | grep "kernel size"

      - name: Prepare AnyKernel3 zip
        run: |
          git clone --depth=1 https://github.com/SOVIET-ANDROID/AnyKernel3.git $HOME/AnyKernel3
          cp boot.img $HOME/AnyKernel3/
          cp kernel/out/arch/arm64/boot/dtbo.img $HOME/AnyKernel3/
          
          cd $HOME/AnyKernel3
          # 删除 .git 目录（避免打包进去）
          rm -rf .git
          
          # 修改 anykernel.sh
          sed -i 's/^block=bootdevice\/by-name\/boot$/block=bootdevice\/by-name\/boot\nflash_boot boot.img/' anykernel.sh
          sed -i 's/^do.devicecheck=.*/do.devicecheck=0/' anykernel.sh
          sed -i 's/^do.cleanup=.*/do.cleanup=1/' anykernel.sh
          
          # 打包（只打包当前目录内容，不包括父目录）
          zip -r9 "$GITHUB_WORKSPACE/kernel.zip" *
          
          # 列出 zip 内容（不应包含 .git）
          echo "=== ZIP 内容（前20行）==="
          unzip -l "$GITHUB_WORKSPACE/kernel.zip" | head -20

      - name: Upload kernel boot.img
        uses: actions/upload-artifact@v4
        with:
          name: boot.img
          path: boot.img

      - name: Upload kernel zip
        uses: actions/upload-artifact@v4
        with:
          name: kernel-anykernel3.zip
          path: kernel.zip
